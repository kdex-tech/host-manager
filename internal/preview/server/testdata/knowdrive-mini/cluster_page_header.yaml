# Cluster-scoped header referenced by the archetype's defaultHeaderRef.
# Minimal HTML body — just enough to verify [[ .Header ]] is rendered.
# No status block needed: fakeclient.stampReadyCondition auto-stamps
# Ready=True on all page-composition kinds at seed time.
apiVersion: kdex.dev/v1alpha1
kind: KDexClusterPageHeader
metadata:
  name: mini-header
spec:
  content: |
    <header class="mini-header">
      <a href="/">[[ l10n .BrandName ]]</a>
    </header>
