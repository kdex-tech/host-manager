# Cluster-scoped footer referenced by the archetype's defaultFooterRef.
# Minimal HTML body — just enough to verify [[ .Footer ]] is rendered.
# No status block needed: fakeclient.stampReadyCondition auto-stamps
# Ready=True on all page-composition kinds at seed time.
apiVersion: kdex.dev/v1alpha1
kind: KDexClusterPageFooter
metadata:
  name: mini-footer
spec:
  content: |
    <footer class="mini-footer">
      <small>[[ l10n "footer.copy" ]]</small>
    </footer>
