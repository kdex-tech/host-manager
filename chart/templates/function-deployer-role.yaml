# Hand-maintained (NOT generated by `make chart-rbac`): the rights the
# kdex-knative-deployer binary uses when it runs as the deployer Job and
# observer CronJob. Each rule cites the call that needs it; keep them in step.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "host-manager.fullname" . }}-function-deployer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "host-manager.labels" . | nindent 4 }}
rules:
  # kdex-knative-deployer cmd/main.go:420,762: server-side apply of the Knative
  # Service, then get. `create` is needed because an apply PATCH that creates
  # the object is authorized as `create`
  # (k8s.io/apiserver pkg/endpoints/handlers/patch.go:203-232,
  # createAuthorizerAttributes with Verb "create").
  - apiGroups:
      - serving.knative.dev
    resources:
      - services
    verbs:
      - create
      - get
      - patch
  # cmd/main.go:472,480,708: read the KDexFunction.
  - apiGroups:
      - kdex.dev
    resources:
      - kdexfunctions
    verbs:
      - get
      - list
  # cmd/main.go:472,480,708: status patch.
  - apiGroups:
      - kdex.dev
    resources:
      - kdexfunctions/status
    verbs:
      - patch
  # retry.go:105,347: get and patch the kpack Image.
  - apiGroups:
      - kpack.io
    resources:
      - images
    verbs:
      - get
      - patch
  # retry.go:126: get the kpack Build.
  - apiGroups:
      - kpack.io
    resources:
      - builds
    verbs:
      - get
  # retry.go:208: get the build pod.
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
