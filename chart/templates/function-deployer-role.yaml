# Hand-maintained (NOT generated by `make chart-rbac`): the rights the
# kdex-knative-deployer binary uses when it runs as the deployer Job and
# observer CronJob. Each rule cites the kdex-knative-deployer functions (in
# cmd/) that need it; keep them in step.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "host-manager.fullname" . }}-function-deployer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "host-manager.labels" . | nindent 4 }}
rules:
  # runDeploy: server-side apply of the Knative Service; waitForReady and
  # observeFunction: get it. `create` is needed because an apply PATCH that
  # creates the object is authorized as `create`
  # (k8s.io/apiserver pkg/endpoints/handlers/patch.go:203-232,
  # createAuthorizerAttributes with Verb "create").
  - apiGroups:
      - serving.knative.dev
    resources:
      - services
    verbs:
      - create
      - get
      - patch
  # observedFunctions: get the KDexFunction, or list the host's.
  - apiGroups:
      - kdex.dev
    resources:
      - kdexfunctions
    verbs:
      - get
      - list
  # observeFunction, recordObserveFailure, clearObserveFailure, setRetryState,
  # resetRetryStateIfSet: merge-patch the KDexFunction's status.
  - apiGroups:
      - kdex.dev
    resources:
      - kdexfunctions/status
    verbs:
      - patch
  # checkAndRetryFailedBuild: get the kpack Image; triggerImageRebuild: patch it.
  - apiGroups:
      - kpack.io
    resources:
      - images
    verbs:
      - get
      - patch
  # checkAndRetryFailedBuild: get the kpack Build.
  - apiGroups:
      - kpack.io
    resources:
      - builds
    verbs:
      - get
  # isBuildPodPreempted: get the build pod.
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
