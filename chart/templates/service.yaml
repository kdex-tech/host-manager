apiVersion: v1
kind: Service
metadata:
  labels:
    {{- include "host-manager.labels" . | nindent 4 }}
  name: {{ include "host-manager.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: server
      protocol: TCP
      name: server
  selector:
    {{- include "host-manager.selectorLabels" . | nindent 4 }}
