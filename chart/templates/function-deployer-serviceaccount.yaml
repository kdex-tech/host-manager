# The identity of the function deployer Job and observer CronJob. Separate
# from host-manager's own ServiceAccount so host-manager needs no Knative or
# kpack write rights of its own.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "host-manager.fullname" . }}-function-deployer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "host-manager.labels" . | nindent 4 }}
