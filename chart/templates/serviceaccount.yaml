{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "kdex-host-manager.labels" . | nindent 4 }}
  name: {{ include "kdex-host-manager.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- with .Values.serviceAccount.secrets }}
secrets:
  {{- range $value := . }}
  - {{ $value }}
  {{- end }}
{{- end }}
{{- end }}
