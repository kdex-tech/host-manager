apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "host-manager.fullname" . }}-function-deployer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "host-manager.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "host-manager.fullname" . }}-function-deployer
subjects:
  - kind: ServiceAccount
    name: {{ include "host-manager.fullname" . }}-function-deployer
    namespace: {{ .Release.Namespace }}
