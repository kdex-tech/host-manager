# Default values for host-manager.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

affinity: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

config:
  # Default configuration for KDex Nexus Manager.
  # Leave blank to use the built-in defaults.
  #
  # Set backendDefault.httpRoute.parentRefs to attach generated HTTPRoutes to
  # a cluster-level Gateway when KDexHost.spec.routing.strategy is HTTPRoute.
  # KDexHost.spec.routing.parentRefs (if any) takes precedence over these.
  # Example:
  #   backendDefault:
  #     httpRoute:
  #       parentRefs:
  #       - name: rsi-gateway
  #         namespace: traefik

env: []

extraArgs: []

extraChartLabels: {}

extraVolumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
extraVolumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

# host-manager specific config
focalHost: ""

# Reverse-proxy transport timeouts. Apply to every KDexFunction proxied
# through this host-manager. responseHeaderTimeout is the knob that
# matters for Knative scale-from-zero cold starts — the default covers
# a typical Go function with cloudsqlconn + gRPC + OpenTelemetry deps;
# bump it for heavier workloads. Set to "0" to fall back to the binary
# defaults (5s dial / 60s response-header / 90s idle).
proxy:
  dialTimeout: 5s
  responseHeaderTimeout: 60s
  idleConnTimeout: 90s

# Inbound webserver timeouts. These bound exposure on every accepted
# connection (kdex-tech/host-manager#49). Streaming responses are not
# severed at writeTimeout any more (#167); they are bounded per-request
# instead:
#   - a chunked response that keeps making progress has its deadline pushed
#     forward on every explicit Flush; a handler that writes without
#     flushing stays bounded by the last-armed deadline.
#   - a text/event-stream response slides the same way but on its own, much
#     larger streamStallTimeout window, because an SSE keep-alive cadence is
#     chosen by the backend and may legitimately exceed writeTimeout. It is
#     still a window: a consumer that stops reading is reclaimed rather than
#     holding a goroutine, an FD and the upstream connection until TCP
#     keepalive (~2h11m).
# Set any value to "0" to disable that deadline entirely — for
# streamStallTimeout that means SSE runs with no write deadline at all.
server:
  readHeaderTimeout: 10s
  readTimeout: 60s
  writeTimeout: 60s
  idleTimeout: 120s
  streamStallTimeout: 5m

# Refresh-token rotation grace window (RFC 9700 4.14,
# kdex-tech/host-manager#169). Real clients fire several refresh requests in
# parallel; with strict rotation only one could win. Within this window a
# concurrent caller replays the winner's pair instead of failing. Exactly one
# rotation still happens, so rotation-based theft detection is unchanged.
# Set to "0" for strict single-winner rotation. Values above 1m are clamped
# to 1m at startup with a warning: the window is a replay window, and a long
# one turns single-use rotation into ordinary replay while keeping a live
# minted token set at rest for its duration.
auth:
  refreshGraceWindow: 10s

fullnameOverride: ""

image:
  pullPolicy: Always
  repository: ghcr.io/kdex-tech/host-manager
  # Empty falls through to .Chart.AppVersion via the deployment template's
  # `{{ .Values.image.tag | default .Chart.AppVersion }}`. Keep this empty
  # so operators pinning chart.version get the matching image tag by
  # default; explicit override (e.g. "latest" for dev) is still possible
  # by setting this. Fixes #39.
  tag: ""

imagePullSecrets: []

livenessProbe:
  httpGet:
    path: /healthz
    port: 8081
  initialDelaySeconds: 15
  periodSeconds: 20

nameOverride: ""

nodeSelector: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  seccompProfile:
    type: RuntimeDefault

readinessProbe:
  httpGet:
    path: /readyz
    port: 8081
  initialDelaySeconds: 5
  periodSeconds: 10

replicaCount: 1

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

# If no name is specified a ClusterRole will be created and used. Otherwise, the specified role will be used
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ""

schedulingGates: []

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true

serviceAccount:
  # Annotations to add to the service account
  annotations: {}
  # Specifies whether a service account should be created
  create: true
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

service:
  port: 8090
  type: ClusterIP
  # Additional volumes on the output Deployment definition.

tolerations: []

valkey:
  enabled: true

  # Image for the wait-on-valkey init container (TCP-wait on the valkey
  # service before the server starts). Overridable so operators can point it
  # at a known-good / multi-arch tag without forking the chart. Must provide
  # bash + /dev/tcp + timeout. See kdex-tech/host-manager#107, #108.
  #
  # NOTE: templates/deployment.yaml repeats this as its `default` fallback, so
  # the two must be bumped together — a stale fallback surfaces whenever an
  # operator sets valkey without waitImage.
  waitImage: ghcr.io/kdex-tech/cli-tools:0.3.19

  # Valkey chart values
  dataStorage:
    enabled: true
    keepPvc: true
    requestedSize: "5Gi"
