# Default values for host-manager.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

affinity: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

config:
  # Default configuration for KDex Nexus Manager.
  # Leave blank to use the built-in defaults.
  #
  # Set backendDefault.httpRoute.parentRefs to attach generated HTTPRoutes to
  # a cluster-level Gateway when KDexHost.spec.routing.strategy is HTTPRoute.
  # KDexHost.spec.routing.parentRefs (if any) takes precedence over these.
  # Example:
  #   backendDefault:
  #     httpRoute:
  #       parentRefs:
  #       - name: rsi-gateway
  #         namespace: traefik

env: []

extraArgs: []

extraChartLabels: {}

extraVolumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
extraVolumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

# host-manager specific config
focalHost: ""

# Reverse-proxy transport timeouts. Apply to every KDexFunction proxied
# through this host-manager. responseHeaderTimeout is the knob that
# matters for Knative scale-from-zero cold starts — the default covers
# a typical Go function with cloudsqlconn + gRPC + OpenTelemetry deps;
# bump it for heavier workloads. Set to "0" to fall back to the binary
# defaults (5s dial / 60s response-header / 90s idle).
proxy:
  dialTimeout: 5s
  responseHeaderTimeout: 60s
  idleConnTimeout: 90s

fullnameOverride: ""

image:
  pullPolicy: Always
  repository: ghcr.io/kdex-tech/host-manager
  # Empty falls through to .Chart.AppVersion via the deployment template's
  # `{{ .Values.image.tag | default .Chart.AppVersion }}`. Keep this empty
  # so operators pinning chart.version get the matching image tag by
  # default; explicit override (e.g. "latest" for dev) is still possible
  # by setting this. Fixes #39.
  tag: ""

imagePullSecrets: []

livenessProbe:
  httpGet:
    path: /healthz
    port: 8081
  initialDelaySeconds: 15
  periodSeconds: 20

nameOverride: ""

nodeSelector: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  seccompProfile:
    type: RuntimeDefault

readinessProbe:
  httpGet:
    path: /readyz
    port: 8081
  initialDelaySeconds: 5
  periodSeconds: 10

replicaCount: 1

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

# If no name is specified a ClusterRole will be created and used. Otherwise, the specified role will be used
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ""

schedulingGates: []

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true

serviceAccount:
  # Annotations to add to the service account
  annotations: {}
  # Specifies whether a service account should be created
  create: true
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

service:
  port: 8090
  type: ClusterIP
  # Additional volumes on the output Deployment definition.

tolerations: []

valkey:
  enabled: true

  # Image for the wait-on-valkey init container (TCP-wait on the valkey
  # service before the server starts). Overridable so operators can point it
  # at a known-good / multi-arch tag without forking the chart. Must provide
  # bash + /dev/tcp + timeout. See kdex-tech/host-manager#107, #108.
  waitImage: ghcr.io/kdex-tech/cli-tools:0.3.18

  # Valkey chart values
  dataStorage:
    enabled: true
    keepPvc: true
    requestedSize: "5Gi"
