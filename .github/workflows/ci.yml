name: CI

on:
  push:
    branches-ignore:
    - "dependabot/**"
    paths:
    - "**"
    - "!docs/**"
    tags:
    - "v*"
  pull_request:
    paths:
    - "**"
    - "!docs/**"

env:
  LC_ALL: en_US.UTF-8

defaults:
  run:
    shell: bash

permissions:
  packages: write
  contents: write

jobs:
  ci:
    name: Build, Test
    runs-on: ubuntu-latest
    steps:
    - name: Clone the code
      uses: actions/checkout@v6

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Run Linter
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.10.1

    - name: Run Unit Tests
      run: |
        go mod tidy
        make test

  publish-image:
    name: Publish Docker Image
    needs: ci
    runs-on: ubuntu-latest
    if: (github.repository == 'kdex-tech/host-manager') && startsWith(github.ref, 'refs/tags/') && (github.event_name != 'pull_request')
    steps:
    - name: Clone the code
      uses: actions/checkout@v6

    - name: Publish Docker Image
      uses: ./.github/actions/publish-docker-image

  publish-chart:
    name: Publish Helm Chart
    needs: publish-image
    runs-on: ubuntu-latest
    if: (github.repository == 'kdex-tech/host-manager') && startsWith(github.ref, 'refs/tags/') && (github.event_name != 'pull_request')
    steps:
    - name: Clone the code
      uses: actions/checkout@v6

    - name: Publish Helm Chart
      uses: ./.github/actions/publish-helm-chart
