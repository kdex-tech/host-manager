name: CI

on:
  push:
    branches-ignore:
    - "dependabot/**"
    paths:
    - "**"
    - "!docs/**"
    tags:
    - "v*"
  pull_request:
    paths:
    - "**"
    - "!docs/**"

defaults:
  run:
    shell: bash

permissions:
  packages: write
  contents: write

jobs:
  ci:
    name: Build, Test
    runs-on: ubuntu-latest
    steps:
    - name: Clone the code
      uses: actions/checkout@v6

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Run Linter
      uses: golangci/golangci-lint-action@v9
      with:
        # Keep in lockstep with GOLANGCI_LINT_VERSION in the Makefile.
        version: v2.13.2

    - name: Run Unit Tests
      run: |
        go mod tidy
        make test

  test-chart:
    name: Test Chart
    needs: ci
    runs-on: ubuntu-latest
    steps:
    - name: Clone the code
      uses: actions/checkout@v6

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Install the latest version of kind
      run: |
        curl -sLo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
        chmod +x ./kind
        sudo mv ./kind /usr/local/bin/kind

    - name: Verify kind installation
      run: kind version

    - name: Create kind cluster
      run: kind create cluster

    - name: Run Go mod tidy
      run: |
        go mod tidy

    - name: Install kubectl
      run: |
        OS=$(go env GOOS)
        ARCH=$(go env GOARCH)
        VERSION=$(curl -L -s https://dl.k8s.io/release/stable.txt)
        echo "Downloading kubectl $VERSION for $OS/$ARCH..."
        curl -sLO "https://dl.k8s.io/release/$VERSION/bin/$OS/$ARCH/kubectl"
        chmod +x ./kubectl
        sudo mv ./kubectl /usr/local/bin/kubectl
        kubectl version --client

    - name: Install Helm
      run: |
        curl -sL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-4 | bash

    - name: Verify Helm installation
      run: helm version

    - name: Lint Helm Chart
      run: |
        helm lint ./chart

    - name: Build and load host-manager image
      run: |
        make docker-build TAG=ci
        kind load docker-image kdex-tech/host-manager:ci

    - name: Install the KDex CRDs
      run: |
        make install-crds

    - name: Install Helm chart for project
      run: |
        helm dependency update ./chart
        helm install ci ./chart \
          --create-namespace \
          --namespace ci \
          --set fullnameOverride=ci \
          --set focalHost=ci \
          --set image.repository=kdex-tech/host-manager \
          --set image.tag=ci \
          --set image.pullPolicy=IfNotPresent

    - name: Check Helm release status
      run: |
        helm status ci --namespace ci

    - name: Verify
      run: |
        kubectl -n ci rollout status deployment ci
        kubectl -n ci apply -f test/fixtures/ci-host.yaml
        kubectl -n ci wait --for=condition=Ready kdex-i-h/ci --timeout=20s

  publish-image:
    name: Publish Docker Image
    needs: [ci, test-chart]
    runs-on: ubuntu-latest
    if: (github.repository == 'kdex-tech/host-manager') && startsWith(github.ref, 'refs/tags/') && (github.event_name != 'pull_request')
    steps:
    - name: Clone the code
      uses: actions/checkout@v6

    - name: Publish Docker Image
      uses: ./.github/actions/publish-docker-image

  publish-chart:
    name: Publish Helm Chart
    needs: publish-image
    runs-on: ubuntu-latest
    if: (github.repository == 'kdex-tech/host-manager') && startsWith(github.ref, 'refs/tags/') && (github.event_name != 'pull_request')
    steps:
    - name: Clone the code
      uses: actions/checkout@v6

    - name: Publish Helm Chart
      uses: ./.github/actions/publish-helm-chart
